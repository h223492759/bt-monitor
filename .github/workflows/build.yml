name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：该 action 内部会执行 `sdkmanager tools`，
      # 而新版 cmdline-tools 已移除 `tools` 包（Failed to find package 'tools'）导致它 exit 1 直接失败。
      # 改为直接复用 runner 预装的 Android SDK，只手动补装需要的包。
      - name: Set up Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools" || true

      - name: Accept SDK licenses
        run: |
          SDKMGR=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          echo "SDKMGR=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true

      - name: Install SDK packages
        run: |
          SDKMGR=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          "$SDKMGR" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms"
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      # 本工程不提交 gradle wrapper，由该 action 提供 Gradle 8.13 并自动做依赖缓存
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # ⚠️ 签名必须跨版本完全一致，否则手机无法覆盖安装升级
      #    （INSTALL_FAILED_UPDATE_INCOMPATIBLE: signatures do not match）。
      #    旧写法每次都由 keytool 现场生成 -> 每版签名都不同 -> 只能卸载重装（会丢数据）。
      #    仓库是 public，密钥库不能提交进代码，所以放在 Actions Secret 里（base64）。
      - name: Restore fixed debug keystore
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > ~/.android/debug.keystore
            echo "已从 Secret 还原固定签名密钥库"
          else
            echo "::warning::未配置 DEBUG_KEYSTORE_B64，本次用临时密钥库；版本间签名会不一致，无法覆盖安装"
            if [ ! -f ~/.android/debug.keystore ]; then
              keytool -genkeypair -v \
                -keystore ~/.android/debug.keystore \
                -storepass android -keypass android \
                -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          ls -l ~/.android/debug.keystore

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK info
        run: |
          ls -lh app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK_FILE=$(basename "$APK")" >> $GITHUB_ENV
          echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')" >> $GITHUB_ENV
          echo "--- 签名证书（每版必须一致，否则无法覆盖安装）---"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -n1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -iE 'Signer #1 certificate (DN|SHA-256)' || true
          SIGNER=$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'Signer #1 certificate SHA-256' | head -n1 | awk '{print $NF}')
          echo "APK_SIGNER=$SIGNER" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt-monitor-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          name: bt-monitor ${{ github.ref_name }}
          body: |
            蓝牙 / 飞行模式 / Wi-Fi / 移动网络 状态监控 APK。

            - APK：${{ env.APK_FILE }}
            - SHA256：${{ env.APK_SHA256 }}
            - 签名证书 SHA-256：${{ env.APK_SIGNER }}
            - 构建来源：${{ github.sha }}

            **签名已固定**：各版本证书相同，可直接覆盖安装升级，数据不丢。
            （早期版本用的是每次构建临时生成的密钥库，签名不一致，需先卸载再装。）

            装好后请按 App 内「保活设置说明」完成 4 步设置，否则长时间监控可能被系统中断。
